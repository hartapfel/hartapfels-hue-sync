<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hartapfel's Hue Sync</title>
  <link rel="stylesheet" href="screen.css">
</head>
<body>
  <main>
    <h1>Hartapfel's Hue Sync</h1>
    <section class="session">
      <div>
        <h2 id="state">Connecting…</h2>
        <p id="room">Video · Moderate</p>
      </div>
      <button id="sync" disabled>Start sync</button>
    </section>
    <section class="setup">
      <h2 id="modeLabel">Sync mode</h2>
      <div id="modes" role="group" aria-labelledby="modeLabel">
        <button data-mode="video" disabled>Video</button>
        <button data-mode="music" disabled>Music</button>
        <button data-mode="gaming" disabled>Gaming</button>
      </div>
      <label for="brightness">Brightness <output id="brightnessValue" for="brightness">100%</output></label>
      <input id="brightness" type="range" min="0" max="100" step="1" value="100" disabled>
      <h2 id="intensityLabel">Intensity</h2>
      <div id="intensities" role="group" aria-labelledby="intensityLabel">
        <button data-level="0" disabled>Subtle</button>
        <button data-level="1" disabled>Moderate</button>
        <button data-level="2" disabled>High</button>
        <button data-level="3" disabled>Intense</button>
      </div>
    </section>
    <section class="setup">
      <h2>Hue Bridge</h2>
      <label for="host">Bridge IP address</label>
      <div class="controls"><input id="host" type="text" maxlength="45" spellcheck="false"><button id="pair">Pair bridge</button></div>
      <p id="pairHelp">Press the link button on your Hue Bridge, then choose Pair bridge.</p>
    </section>
    <section class="setup">
      <h2>Entertainment area</h2>
      <div id="areas"></div>
      <button id="reload" disabled>Load areas</button>
    </section>
    <section class="setup">
      <h2>Video input</h2>
      <button id="piccap" aria-pressed="false" disabled>PicCap stream</button>
      <button id="direct" aria-pressed="false" disabled>Direct TV capture</button>
      <p id="sourceHelp"></p>
    </section>
    <section class="setup">
      <button id="boot" aria-pressed="false" disabled>Start sync on power-on · Off</button>
    </section>
    <p id="feedback" role="status" aria-live="polite"></p>
  </main>
  <script src="screen.js"></script>
</body>
</html>
